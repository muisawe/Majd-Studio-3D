name: Release

# Push a tag "v<version.json>" to publish to muisawe/Majd3D, where installed
# studios look for updates. Run manually for a dry run that publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build release packages
        run: python scripts/build_release.py --output dist
      - name: Publish to muisawe/Majd3D
        env:
          GH_TOKEN: ${{ secrets.MAJD3D_RELEASE_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run && 'true' || 'false' }}
        run: python scripts/publish_release.py --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/
